<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 460" role="img" aria-labelledby="title desc">
  <title id="title">YOR Texture Forensics pipeline</title>
  <desc id="desc">Five-stage image inference pipeline from upload through grayscale features, scaling, RBF SVM prediction, and cautious presentation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000000"/><stop offset="0.7" stop-color="#050505"/><stop offset="1" stop-color="#160303"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#671515"/><stop offset="1" stop-color="#ff8a7f"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#e84b4b"/></marker>
  </defs>
  <rect width="1500" height="460" fill="url(#bg)"/><path d="M60 74H1440M60 386H1440" stroke="#e84b4b" stroke-opacity="0.22"/>
  <g font-family="DM Mono, Consolas, monospace"><text x="60" y="52" font-size="16" letter-spacing="4" fill="#ff8a7f">YOR // SYSTEM FLOW // TEXTURE FORENSICS</text><text x="60" y="424" font-size="14" letter-spacing="2" fill="#c4c4c4">THE OUTPUT IS A MODEL ESTIMATE, NOT PROOF OF IMAGE ORIGIN.</text></g>
  <g stroke="#e84b4b" stroke-width="2" marker-end="url(#arrow)"><path d="M276 230H328"/><path d="M556 230H608"/><path d="M836 230H888"/><path d="M1116 230H1168"/></g>
  <g font-family="DM Mono, Consolas, monospace">
    <g transform="translate(60 124)"><rect width="216" height="212" rx="5" fill="#050505" stroke="#671515" stroke-width="2"/><rect width="216" height="5" fill="#e84b4b"/><text x="22" y="42" font-size="13" letter-spacing="2" fill="#ff8a7f">01 / ACQUIRE</text><text x="22" y="88" font-size="24" fill="#f5eaea">Upload</text><text x="22" y="126" font-size="14" fill="#c4c4c4">JPG / PNG / JPEG</text><text x="22" y="153" font-size="14" fill="#c4c4c4">25 MB maximum</text><text x="22" y="190" font-size="12" fill="#ff8a7f">Validated request bytes</text></g>
    <g transform="translate(340 124)"><rect width="216" height="212" rx="5" fill="#050505" stroke="#671515" stroke-width="2"/><rect width="216" height="5" fill="#e84b4b"/><text x="22" y="42" font-size="13" letter-spacing="2" fill="#ff8a7f">02 / EXTRACT</text><text x="22" y="88" font-size="24" fill="#f5eaea">Texture</text><text x="22" y="126" font-size="14" fill="#c4c4c4">Grayscale 224²</text><text x="22" y="153" font-size="14" fill="#c4c4c4">LBP + GLCM</text><text x="22" y="190" font-size="12" fill="#ff8a7f">17-value vector</text></g>
    <g transform="translate(620 124)"><rect width="216" height="212" rx="5" fill="#050505" stroke="#671515" stroke-width="2"/><rect width="216" height="5" fill="#e84b4b"/><text x="22" y="42" font-size="13" letter-spacing="2" fill="#ff8a7f">03 / NORMALIZE</text><text x="22" y="88" font-size="24" fill="#f5eaea">Scale</text><text x="22" y="126" font-size="14" fill="#c4c4c4">Fitted on train split</text><text x="22" y="153" font-size="14" fill="#c4c4c4">RBF-compatible inputs</text><text x="22" y="190" font-size="12" fill="#9ad7b2">No test leakage</text></g>
    <g transform="translate(900 124)"><rect width="216" height="212" rx="5" fill="#050505" stroke="#671515" stroke-width="2"/><rect width="216" height="5" fill="#e84b4b"/><text x="22" y="42" font-size="13" letter-spacing="2" fill="#ff8a7f">04 / CLASSIFY</text><text x="22" y="88" font-size="24" fill="#f5eaea">RBF SVM</text><text x="22" y="126" font-size="14" fill="#c4c4c4">Probability estimate</text><text x="22" y="153" font-size="14" fill="#c4c4c4">Confidence signal</text><text x="22" y="190" font-size="12" fill="#a5b4d0">Dataset-bound model</text></g>
    <g transform="translate(1180 124)"><rect width="216" height="212" rx="5" fill="#050505" stroke="#e84b4b" stroke-width="2"/><rect width="216" height="5" fill="url(#accent)"/><text x="22" y="42" font-size="13" letter-spacing="2" fill="#ff8a7f">05 / PRESENT</text><text x="22" y="88" font-size="24" fill="#f5eaea">Verdict</text><text x="22" y="126" font-size="14" fill="#c4c4c4">Real / AI estimate</text><text x="22" y="153" font-size="14" fill="#c4c4c4">Preview + scores</text><text x="22" y="190" font-size="12" fill="#ff8a7f">Not authenticity proof</text></g>
  </g>
</svg>
