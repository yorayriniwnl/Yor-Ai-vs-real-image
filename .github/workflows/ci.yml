name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Training protocol regression tests
        run: python -m unittest tests.test_training_protocol
      - name: Run deterministic model evaluation
        run: python scripts/evaluate_model.py
      - name: Verify evaluation artifact shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/model-evaluation.json")
          data = json.loads(p.read_text())
          assert data["total_samples"] == 533
          assert data["train_samples"] == 426
          assert data["test_samples"] == 107
          assert 0 <= data["accuracy"] <= 1
          print(data["accuracy"])
          PY
      - name: Flask route smoke test
        run: |
          python - <<'PY'
          from index import app
          client = app.test_client()
          response = client.get("/")
          assert response.status_code == 200, response.status_code
          assert b"Texture Forensics" in response.data
          print("GET / OK")
          PY
