name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Reject unsupported new dataset media
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python - <<'PY'
          import subprocess
          from pathlib import Path

          base = "origin/${{ github.base_ref }}"
          added = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=A", f"{base}...HEAD", "--", "dataset"],
              text=True,
          ).splitlines()

          allowed = {".jpg", ".jpeg", ".png", ".webp", ".avif"}
          limit = 6 * 1024 * 1024
          violations = []
          for name in added:
              path = Path(name)
              if not path.is_file():
                  continue
              suffix = path.suffix.lower()
              if suffix not in allowed:
                  violations.append(f"unsupported dataset media: {name}")
                  continue
              if path.stat().st_size > limit:
                  violations.append(f"dataset file exceeds 6 MiB: {name}")

          assert not violations, "\n".join(violations)
          print(f"Checked {len(added)} newly added dataset files")
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Training protocol regression tests
        run: python -m unittest tests.test_training_protocol
      - name: Run deterministic model evaluation
        run: |
          python scripts/evaluate_model.py
          cat outputs/model-evaluation.json
      - name: Verify evaluation artifact shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/model-evaluation.json")
          data = json.loads(p.read_text())
          assert data["total_samples"] == 534
          assert data["train_samples"] == 427
          assert data["test_samples"] == 107
          assert 0 <= data["accuracy"] <= 1
          print(data["accuracy"])
          PY
      - name: Flask route smoke test
        run: |
          python - <<'PY'
          from index import app
          client = app.test_client()
          response = client.get("/")
          assert response.status_code == 200, response.status_code
          assert b"Texture Forensics" in response.data
          print("GET / OK")
          PY